name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # C++ build, test, and static analysis
  cpp-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build python3-dev

      - name: Check C++ formatting
        run: >-
          find include src tests apps max-package -type f
          \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Check Max SDK wrapper headers
        run: make max-sdk-header-check BUILD_DIR=.bin JOBS=2

      - name: Run C++ tests
        run: ctest --preset release

      - name: Verify installed CMake package
        run: |
          cmake --install .bin --prefix "${{ runner.temp }}/sunny-install"
          cmake -S tests/package -B "${{ runner.temp }}/sunny-package-smoke" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sunny-install"
          cmake --build "${{ runner.temp }}/sunny-package-smoke"
          ctest --test-dir "${{ runner.temp }}/sunny-package-smoke" --output-on-failure

  # CodeQL static analysis
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: .analysis/codeql

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # Python tests (with native module)
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build native module for this Python
        run: |
          cmake -S . -B .bin-python -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNNY_BUILD_TESTS=OFF \
            -DSUNNY_BUILD_MCP_SERVER=OFF
          cmake --build .bin-python --target sunny_native

      - name: Run tests
        run: |
          PYTHONPATH=python:remote_script:.bin-python/python \
          uv run pytest tests/python/ -v --tb=short

      - name: Verify native runtime against type stub
        run: >-
          SUNNY_NATIVE_BUILD_DIR=.bin-python/python
          uv run python tests/python/run_native_stubtest.py

      - name: Build and install wheel
        run: |
          uv build --out-dir "${{ runner.temp }}/sunny-wheel"
          uv venv "${{ runner.temp }}/sunny-wheel-venv"
          uv pip install \
            --python "${{ runner.temp }}/sunny-wheel-venv/bin/python" \
            "${{ runner.temp }}"/sunny-wheel/sunny-*.whl
          "${{ runner.temp }}/sunny-wheel-venv/bin/python" -c \
            "from sunny.core.engine import TheoryEngine; assert TheoryEngine().get_scale_notes('C', 'major', 4)[0] == 60"

  # Python linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy python/sunny --ignore-missing-imports

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install security tools
        run: uv pip install bandit

      - name: Run bandit security scanner
        run: >-
          uv run bandit -r python/sunny remote_script/Sunny -ll -ii

  # macOS build (for cross-platform verification)
  cpp-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Run C++ tests
        run: ctest --preset release

      - name: Build staged Max package
        run: |
          cmake -S max-package -B .bin-max -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .bin-max --target sunny_max_archive

      - name: Validate exact staged Max package
        run: >-
          python3 tests/max_sdk_headers/validate_staged_package.py
          --source max-package
          --staged .bin-max/package
          --archive "$(find .bin-max -maxdepth 1 -name 'Sunny-*.zip' -print -quit)"
          --platform macos

      - uses: actions/upload-artifact@v4
        with:
          name: sunny-max-macos
          path: |
            .bin-max/package
            .bin-max/Sunny-*.zip
            .bin-max/Sunny-*.zip.sha256

  max-package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure staged Max package
        run: >-
          cmake -S max-package -B .bin-max
          -G "Visual Studio 17 2022" -A x64

      - name: Build staged Max package
        run: cmake --build .bin-max --config Release --target sunny_max_archive

      - name: Validate exact staged Max package
        run: >-
          python tests/max_sdk_headers/validate_staged_package.py
          --source max-package
          --staged .bin-max/package
          --archive .bin-max/Sunny-0.4.0-windows-x86_64.zip
          --platform windows

      - uses: actions/upload-artifact@v4
        with:
          name: sunny-max-windows
          path: |
            .bin-max/package
            .bin-max/Sunny-*.zip
            .bin-max/Sunny-*.zip.sha256
