name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # C++ build, test, and static analysis
  cpp-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build python3-dev

      - name: Check C++ formatting
        run: >-
          find include src tests apps max-package -type f
          \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Check Max SDK wrapper headers
        run: make max-sdk-header-check BUILD_DIR=.bin JOBS=2

      - name: Run C++ tests
        run: ctest --preset release

      - name: Verify installed CMake package
        run: |
          cmake --install .bin --prefix "${{ runner.temp }}/sunny-install"
          cmake -S tests/package -B "${{ runner.temp }}/sunny-package-smoke" \
            -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sunny-install"
          cmake --build "${{ runner.temp }}/sunny-package-smoke"
          ctest --test-dir "${{ runner.temp }}/sunny-package-smoke" --output-on-failure

  # CodeQL static analysis
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev

      - name: Initialize CodeQL
        id: codeql-init
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: ./.analysis/codeql

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Test custom CodeQL type models
        run: >-
          "${{ steps.codeql-init.outputs.codeql-path }}" test run
          --threads=2 --ram=4096 .analysis/codeql/test

  # Python tests (with native module)
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install independent notation parser
        if: matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y lilypond

      # sunny-mcp drives the end-to-end tests against the offline Live model.
      - name: Build native module and MCP server for this Python
        run: |
          cmake -S . -B .bin-python -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNNY_BUILD_TESTS=OFF \
            -DSUNNY_BUILD_MCP_SERVER=ON
          cmake --build .bin-python --target sunny_native sunny-mcp

      - name: Run tests
        env:
          SUNNY_LILYPOND_COMMAND: ${{ matrix.python-version == '3.12' && 'lilypond' || '' }}
        run: |
          PYTHONPATH=python:remote_script:.bin-python/python \
          SUNNY_MCP_BINARY=.bin-python/sunny-mcp \
          uv run pytest tests/python/ -v --tb=short

      - name: Verify native runtime against type stub
        run: >-
          SUNNY_NATIVE_BUILD_DIR=.bin-python/python
          uv run python tests/python/run_native_stubtest.py

      - name: Build and install wheel
        run: |
          uv build --out-dir "${{ runner.temp }}/sunny-wheel"
          uv venv "${{ runner.temp }}/sunny-wheel-venv"
          uv pip install \
            --python "${{ runner.temp }}/sunny-wheel-venv/bin/python" \
            "${{ runner.temp }}"/sunny-wheel/sunny-*.whl
          "${{ runner.temp }}/sunny-wheel-venv/bin/python" -c \
            "from sunny.core.engine import TheoryEngine; assert TheoryEngine().get_scale_notes('C', 'major', 4)[0] == 60"

  # The Docker image: MCP handshake offline, then the end-to-end suite with the
  # container as the server, against the real Remote Script and the offline Live model.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the paired release
        run: |
          python3 tools/release.py build --tag sunny-mcp:ci \
            --output "${{ runner.temp }}/sunny-ci-release" \
            > "${{ runner.temp }}/sunny-release-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sunny-release-report.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SUNNY_CI_RELEASE_SHA256=' + report['release_manifest_sha256'] + '\n')
              stream.write('SUNNY_RELEASE_VOLUME_IMAGE=' + report['manifest']['image']['local_immutable_id'] + '\n')
          PY

      - name: Verify full image-owned release inventory
        run: |
          python3 "${{ runner.temp }}/sunny-ci-release/operator/live_qualification/verify_artifacts.py" \
            --release "${{ runner.temp }}/sunny-ci-release" \
            --expected-manifest-sha256 "$SUNNY_CI_RELEASE_SHA256"

      - name: Verify image-owned qualification package
        run: >-
          python3 tools/export_live_qualification.py
          --image-id "$SUNNY_RELEASE_VOLUME_IMAGE"
          --output "${{ runner.temp }}/sunny-ci-release.zip"

      - name: Answer MCP offline
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm sunny-mcp:ci \
            | python3 -c "import json,sys; r=[json.loads(l) for l in sys.stdin]; assert r[0]['result']['serverInfo']['name']=='sunny-mcp'; names={t['name'] for t in r[1]['result']['tools']}; assert {'score_create','get_timbre_json','replace_timbre_effect','remove_timbre_automation','get_mix_json','replace_mix_effect','remove_mix_effect','reorder_mix_effects','query_how_would_x_handle','project_plan_to_ableton','project_realization_plan','project_realization_apply'} <= names"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: End-to-end through the container
        run: |
          python -m pip install pytest 'mido>=1.3,<2'
          SUNNY_TEST_BRIDGE_BIND_HOST=0.0.0.0 \
          SUNNY_TEST_BRIDGE_HOST=host.docker.internal \
          SUNNY_MCP_COMMAND="docker run -i --rm --add-host host.docker.internal:host-gateway -e SUNNY_ABLETON_HOST -e SUNNY_TCP_PORT sunny-mcp:ci" \
          PYTHONPATH=remote_script:python \
          python -m pytest tests/python/test_live_end_to_end.py -v --tb=short

      - name: Preserve project data across owned container death and volume restore
        env:
          SUNNY_RELEASE_VOLUME_TESTS: '1'
        run: python -m pytest tests/python/test_release_volume_lifecycle.py -v --tb=short

      - name: Managed native authoring and recovery through the container
        run: |
          SUNNY_TEST_BRIDGE_BIND_HOST=0.0.0.0 \
          SUNNY_TEST_BRIDGE_HOST=host.docker.internal \
          SUNNY_NATIVE_MCP_COMMAND="docker run -i --rm --user $(id -u):$(id -g) --add-host host.docker.internal:host-gateway --mount type=bind,source={workspace_dir},target=/data -e SUNNY_WORKSPACE_PATH -e SUNNY_ABLETON_HOST -e SUNNY_TCP_PORT sunny-mcp:ci" \
          PYTHONPATH=remote_script:python \
          python -m pytest \
            tests/python/test_mcp_realization_workflow.py \
            tests/python/test_mcp_realization_mismatch.py \
            tests/python/test_mcp_note_population_workflow.py \
            tests/python/test_mcp_native_device_workflow.py \
            tests/python/test_mcp_native_recovery_workflow.py \
            tests/python/test_mcp_mix_realization_workflow.py \
            tests/python/test_mcp_native_geometry_workflow.py \
            tests/python/test_mcp_native_clip_revision_workflow.py \
            tests/python/test_mcp_native_song_settings_workflow.py \
            tests/python/test_mcp_native_envelope_revision_workflow.py \
            tests/python/test_mcp_native_effect_workflow.py \
            tests/python/test_mcp_native_mixer_workflow.py \
            tests/python/test_mcp_retired_part_recovery.py \
            tests/python/test_mcp_historical_part_recovery.py \
            tests/python/test_mcp_native_routing_workflow.py \
            tests/python/test_mcp_project_portfolio.py \
            tests/python/test_mcp_native_project_portfolio.py \
            tests/python/test_mcp_project_realization_coordinator.py \
            tests/python/test_mcp_project_realization_native_admission.py \
            tests/python/test_mcp_historic_device_recovery_workflow.py \
            tests/python/test_mcp_source_projection_boundary.py \
            tests/python/test_mcp_bypassed_effect_intent.py \
            tests/python/test_mcp_bypassed_effect_coordinator.py \
            tests/python/test_mcp_project_final_pan_observation.py \
            tests/python/test_mcp_project_preserved_devices_summary.py \
            tests/python/test_mcp_coordinator_capacity_independent.py \
            -v --tb=short

      - name: Authoring and recovery across container restarts
        run: |
          SUNNY_WORKSPACE_MCP_COMMAND="docker run -i --rm --user $(id -u):$(id -g) --network none --mount type=bind,source={workspace_dir},target=/data -e SUNNY_WORKSPACE_PATH -e SUNNY_WORKSPACE_RECOVERY sunny-mcp:ci" \
          PYTHONPATH=remote_script:python \
          python -m pytest tests/python/test_mcp_workspace_workflow.py tests/python/test_mcp_native_timbre_plan.py -v --tb=short

  # Actual PowerShell/NTFS transition witnesses do not require Live, SSH or Python on operator PCs.
  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test driver
        run: python -m pip install pytest
      - name: Exercise Windows installation, transfer and owned doctor recovery
        run: >-
          python -m pytest
          tests/python/test_windows_installer.py
          tests/python/test_windows_transfer.py
          tests/python/test_windows_doctor.py
          -v --tb=short

  # Python linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy python/sunny --ignore-missing-imports

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install security tools
        run: uv pip install bandit

      - name: Run bandit security scanner
        run: >-
          uv run bandit -r python/sunny remote_script/Sunny -ll -ii

  # macOS build (for cross-platform verification)
  cpp-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Run C++ tests
        run: ctest --preset release

      - name: Build staged Max package
        run: |
          cmake -S max-package -B .bin-max -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .bin-max --target sunny_max_archive

      - name: Validate exact staged Max package
        run: >-
          python3 tests/max_sdk_headers/validate_staged_package.py
          --source max-package
          --staged .bin-max/package
          --archive "$(find .bin-max -maxdepth 1 -name 'Sunny-*.zip' -print -quit)"
          --platform macos

      - uses: actions/upload-artifact@v4
        with:
          name: sunny-max-macos
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .bin-max/package
            .bin-max/Sunny-*.zip
            .bin-max/Sunny-*.zip.sha256

  max-package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure staged Max package
        run: >-
          cmake -S max-package -B .bin-max -A x64

      - name: Build staged Max package
        run: cmake --build .bin-max --config Release --target sunny_max_archive

      - name: Validate exact staged Max package
        run: >-
          python tests/max_sdk_headers/validate_staged_package.py
          --source max-package
          --staged .bin-max/package
          --archive .bin-max/Sunny-0.4.0-windows-x86_64.zip
          --platform windows

      - uses: actions/upload-artifact@v4
        with:
          name: sunny-max-windows
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .bin-max/package
            .bin-max/Sunny-*.zip
            .bin-max/Sunny-*.zip.sha256
