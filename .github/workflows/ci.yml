name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # C++ build, test, and static analysis
  cpp-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Run C++ tests
        run: ctest --preset release

      - name: Upload sunny_native module
        uses: actions/upload-artifact@v4
        with:
          name: sunny-native-linux
          path: .bin/src/Sunny.Infrastructure/sunny_native*.so
          if-no-files-found: error

  # CodeQL static analysis
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: .analysis/codeql

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # Python tests (with native module)
  python-test:
    needs: cpp-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download sunny_native module
        uses: actions/download-artifact@v4
        with:
          name: sunny-native-linux
          path: .bin/src/Sunny.Infrastructure/

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: |
          PYTHONPATH=src uv run pytest src/Sunny.Test/Python/ -v --tb=short

  # Python linting
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy src/sunny --ignore-missing-imports

  # Security scanning (advisory: bandit findings on the Remote Script's
  # deliberate 0.0.0.0 bind are accepted; see docs/decisions.md)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install security tools
        run: uv pip install bandit

      - name: Run bandit security scanner
        run: uv run bandit -r src/sunny -ll -ii
        continue-on-error: true

  # macOS build (for cross-platform verification)
  cpp-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Configure CMake
        run: cmake --preset release

      - name: Build C++
        run: cmake --build --preset release

      - name: Run C++ tests
        run: ctest --preset release
