[project]
name = "sunny"
version = "0.4.0"
description = "Python scripting facade for the Sunny music theory engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Sunny Contributors" }
]
keywords = [
    "ableton",
    "mcp",
    "music",
    "ai",
    "live",
    "midi",
    "daw",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["scikit-build-core>=0.12", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/sunny"]
install.components = ["SunnyPython"]
cmake.args = [
    "-DSUNNY_BUILD_TESTS=OFF",
    "-DSUNNY_BUILD_MCP_SERVER=OFF",
    "-DSUNNY_BUILD_MAX_EVIDENCE_TOOL=OFF",
    "-DSUNNY_BUILD_PYTHON_BINDINGS=ON",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "D",    # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ableton-side control surface: runs inside Live's embedded Python and is
# kept minimal-churn; docstring pedantry and line-length do not apply.
"remote_script/Sunny/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
strict_equality = true
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = "sunny_native.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["python/sunny"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
